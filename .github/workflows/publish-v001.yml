name: Publish v0.01 Release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v001.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify v0.01 patch payloads
        shell: python
        run: |
          import hashlib
          import json
          from pathlib import Path

          manifest_path = Path("manifests/v0.01-patch-payloads.sha256.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))

          for name, expected in manifest.items():
              path = Path("patches/v0.01") / name
              if not path.is_file():
                  raise SystemExit(f"Missing patch payload: {path}")
              data = path.read_bytes()
              size = len(data)
              sha = hashlib.sha256(data).hexdigest()
              if size != expected["size"]:
                  raise SystemExit(f"Size mismatch for {name}: expected {expected['size']}, got {size}")
              if sha != expected["sha256"]:
                  raise SystemExit(f"SHA-256 mismatch for {name}: expected {expected['sha256']}, got {sha}")
              print(f"PASS {name} {size} {sha}")

      - name: Build deterministic v0.01 release package
        shell: python
        run: |
          import hashlib
          import json
          import shutil
          import zipfile
          from pathlib import Path

          package_name = "Kancolle_Kai_CHS_v0.01"
          stage = Path("release_build") / package_name
          stage.mkdir(parents=True, exist_ok=True)

          files = [
              "README.md",
              "APPLY_V001.cmd",
              "PROJECT_PATCH_LEDGER.json",
              "docs/INSTALL.md",
              "docs/SOURCE_BASELINE.md",
              "docs/V001_FINAL_HASHES.md",
              "manifests/v0.01.json",
              "manifests/v0.01-patch-payloads.sha256.json",
              "tools/apply_v001.py",
              "patches/v0.01/README.md",
              "release-notes/v0.01.md",
          ]
          files += [str(p) for p in sorted(Path("patches/v0.01").glob("*.kckpatch"))]

          for rel in files:
              src = Path(rel)
              if not src.is_file():
                  raise SystemExit(f"Required release file missing: {src}")
              dst = stage / src
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(src, dst)

          zip_path = Path(f"{package_name}.zip")
          fixed_time = (2026, 8, 23, 0, 0, 0)
          with zipfile.ZipFile(zip_path, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for path in sorted(stage.rglob("*")):
                  if not path.is_file():
                      continue
                  arcname = path.relative_to(stage.parent).as_posix()
                  info = zipfile.ZipInfo(arcname, fixed_time)
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.external_attr = 0o644 << 16
                  z.writestr(info, path.read_bytes(), compress_type=zipfile.ZIP_DEFLATED, compresslevel=9)

          zip_sha = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          payload_manifest = json.loads(Path("manifests/v0.01-patch-payloads.sha256.json").read_text(encoding="utf-8"))
          checksum_path = Path("Kancolle_Kai_CHS_v0.01_SHA256SUMS.txt")
          lines = [
              f"{zip_sha}  {zip_path.name}",
              "",
              "Patch payload SHA-256:",
          ]
          for name in sorted(payload_manifest):
              lines.append(f"{payload_manifest[name]['sha256']}  patches/v0.01/{name}")
          checksum_path.write_text("\n".join(lines) + "\n", encoding="utf-8")

          Path("release_zip_sha256.txt").write_text(zip_sha + "\n", encoding="ascii")
          print(f"Release ZIP: {zip_path}")
          print(f"Release ZIP SHA-256: {zip_sha}")

      - name: Create or verify GitHub Release v0.01
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TARGET: a9a0ddf7bd0059751178dd062620d7209f4581e6
        run: |
          if gh release view v0.01 >/dev/null 2>&1; then
            echo "Release v0.01 already exists; refreshing notes and verified assets."
            gh release edit v0.01 \
              --title "v0.01 — Pre-Game Translation Milestone" \
              --notes-file release-notes/v0.01.md
            gh release upload v0.01 \
              Kancolle_Kai_CHS_v0.01.zip \
              Kancolle_Kai_CHS_v0.01_SHA256SUMS.txt \
              --clobber
          else
            gh release create v0.01 \
              Kancolle_Kai_CHS_v0.01.zip \
              Kancolle_Kai_CHS_v0.01_SHA256SUMS.txt \
              --target "$RELEASE_TARGET" \
              --title "v0.01 — Pre-Game Translation Milestone" \
              --notes-file release-notes/v0.01.md
          fi

          RELEASE_URL="$(gh release view v0.01 --json url --jq .url)"
          echo "RELEASE_URL=$RELEASE_URL" >> "$GITHUB_ENV"
          echo "Release URL: $RELEASE_URL"

      - name: Record auditable release status
        shell: python
        env:
          RELEASE_URL: ${{ env.RELEASE_URL }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_COMMIT: ${{ github.sha }}
        run: |
          import json
          import os
          from pathlib import Path

          zip_sha = Path("release_zip_sha256.txt").read_text(encoding="ascii").strip()
          status = {
              "release": "v0.01",
              "title": "v0.01 — Pre-Game Translation Milestone",
              "status": "PUBLISHED",
              "release_url": os.environ["RELEASE_URL"],
              "release_zip": "Kancolle_Kai_CHS_v0.01.zip",
              "release_zip_sha256": zip_sha,
              "checksum_asset": "Kancolle_Kai_CHS_v0.01_SHA256SUMS.txt",
              "source_qc_commit": "a9a0ddf7bd0059751178dd062620d7209f4581e6",
              "workflow_commit": os.environ["WORKFLOW_COMMIT"],
              "github_actions_run_id": os.environ["RUN_ID"],
              "github_actions_run_attempt": os.environ["RUN_ATTEMPT"],
              "payload_count": 8,
              "repository_qc": "PASS"
          }
          out = Path("release-status/v0.01.json")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(status, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

      - name: Commit release status receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release-status/v0.01.json
          git commit -m "Record published v0.01 release status"
          git push
